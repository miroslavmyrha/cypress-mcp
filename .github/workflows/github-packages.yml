name: GitHub Packages

# Publishes the package to the registry of GitHub as well, so that it shows under "Packages"
# of the repository. npmjs.com stays the registry people install from.
# Runs for every published release; run it by hand to publish the version that is on main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@miroslavmyrha'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A version that is already there is left alone, so the job can be run again safely.
      - name: Publish unless this version is already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@miroslavmyrha/cypress-mcp@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version $version is already on GitHub Packages."
          else
            npm publish --registry https://npm.pkg.github.com
          fi
